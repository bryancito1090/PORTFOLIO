<div class="featured-projects-wrapper" role="region" [attr.aria-label]="i18n.t().fpAriaLabel">
  <!-- Cabecera limpia y prominente de la sección con controles del carrusel -->
  <header class="projects-section-header">
    <div class="header-left">
      <div class="title-with-badge">
        <span class="pulse-indicator" aria-hidden="true"></span>
        <h2 class="section-title">{{ i18n.t().fpHeaderTag }}</h2>
      </div>
    </div>

    <div class="carousel-nav-controls">
      <button
        type="button"
        class="carousel-nav-btn"
        (click)="prev()"
        [attr.aria-label]="i18n.t().fpCarouselPrev"
        title="Anterior"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button
        type="button"
        class="carousel-nav-btn"
        (click)="next()"
        [attr.aria-label]="i18n.t().fpCarouselNext"
        title="Siguiente"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </header>

  <!-- Cuadrícula de Proyectos en Carrusel (Ocupa todo el espacio horizontal) -->
  <div class="projects-grid">
    @for (prj of visibleProjects(); track prj.id) {
      <button
        type="button"
        class="project-card"
        [class.is-selected]="selectedProjectId() === prj.id"
        [attr.aria-pressed]="selectedProjectId() === prj.id"
        (click)="selectProject(prj.id)"
      >
        <div class="project-image-slot" [class.no-image]="!prj.imageUrl">
          @if (prj.imageUrl && !imageErrors()[prj.imageUrl]) {
            <img
              [src]="prj.imageUrl"
              [alt]="i18n.t().fpAltPrefix + prj.title"
              class="project-img"
              (error)="onImageError(prj.imageUrl)"
              loading="lazy"
            />
          } @else {
            <!-- Diseño Blueprint / Ficha Técnica para SIPLECE o proyectos sin capturas -->
            <div class="tech-blueprint-slot">
              <div class="blueprint-grid-overlay" aria-hidden="true"></div>
              <div class="blueprint-content">
                <span class="blueprint-icon">◧</span>
                <span class="blueprint-code">{{ prj.code }}</span>
                <span class="blueprint-title">{{ prj.title }}</span>
                <span class="blueprint-spec">{{ i18n.t().fpNoImagesTechnical }}</span>
              </div>
            </div>
          }

          @if (prj.inDevelopment) {
            <div class="in-dev-badge">
              <span class="in-dev-dot"></span>
              <span>{{ i18n.t().fpInDevelopment }}</span>
            </div>
          }
        </div>

        <div class="project-content">
          <div class="project-meta-row">
            <div class="institution-badge">
              <span class="meta-bullet">●</span>
              <span class="meta-institution">{{ prj.institution }}</span>
            </div>
            <span class="meta-tag">{{ prj.subtitle }}</span>
          </div>

          <h3 class="project-title">{{ prj.title }}</h3>
          <p class="project-impact">{{ prj.impact }}</p>

          <div class="project-tags-row">
            @for (tag of prj.tags; track tag) {
              <span class="tech-chip">{{ tag }}</span>
            }
          </div>

          <span class="project-action">
            {{ selectedProjectId() === prj.id ? 'Detalle abierto' : 'Ver detalle' }}
          </span>
        </div>
      </button>
    }
  </div>

  <!-- Indicadores de página (Dots) -->
  @if (totalPages() > 1) {
    <div class="carousel-dots-row" role="tablist" aria-label="Selector de proyectos">
      @for (pageIdx of pagesArray(); track pageIdx) {
        <button
          type="button"
          class="carousel-dot"
          [class.is-active]="currentIndex() === pageIdx"
          (click)="goToPage(pageIdx)"
          [attr.aria-label]="'Página ' + (pageIdx + 1)"
          [attr.aria-selected]="currentIndex() === pageIdx"
        >
          <span class="dot-inner"></span>
        </button>
      }
    </div>
  }

  <!-- Modal Detalle del Proyecto Seleccionado -->
  @if (selectedProject(); as selected) {
    <div class="project-detail-overlay" (click)="clearSelection()">
      <div class="project-detail-shell" (click)="$event.stopPropagation()">
        <app-project-detail [project]="selected" (close)="clearSelection()" />
      </div>
    </div>
  }
</div>
