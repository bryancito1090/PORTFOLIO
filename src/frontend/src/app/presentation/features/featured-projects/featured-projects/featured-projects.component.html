<div class="featured-projects-wrapper" role="region" [attr.aria-label]="i18n.t().fpAriaLabel">
  <header class="section-micro-header">
    <div class="header-left">
      <span class="pulse-indicator" aria-hidden="true"></span>
      <span class="header-tag">{{ i18n.t().fpHeaderTag }}</span>
    </div>
  </header>

  <div class="projects-stack">
    @for (prj of projects(); track prj.id) {
      <button
        type="button"
        class="project-card"
        [class.is-selected]="selectedProjectId() === prj.id"
        [style.--prj-accent]="prj.accentColor"
        [attr.aria-pressed]="selectedProjectId() === prj.id"
        (click)="selectProject(prj.id)"
      >
        <div class="project-image-slot">
          @if (!imageErrors()[prj.id] && prj.imageUrl) {
            <img
              [src]="prj.imageUrl"
              [alt]="i18n.t().fpAltPrefix + prj.title"
              class="project-img"
              (error)="onImageError(prj.id)"
              loading="lazy"
            />
          } @else {
            <div class="image-placeholder">
              <span class="placeholder-icon">◧</span>
              <span class="placeholder-code">{{ prj.code }}</span>
              <span class="placeholder-label">{{ i18n.t().fpPlaceholderImage }}</span>
            </div>
          }
        </div>

        <div class="project-content">
          <div class="project-meta-row">
            <div class="institution-badge">
              <span class="meta-bullet">●</span>
              <span class="meta-institution">{{ prj.institution }}</span>
            </div>
            <span class="meta-tag">{{ prj.subtitle }}</span>
          </div>

          <h3 class="project-title">{{ prj.title }}</h3>
          <p class="project-impact">{{ prj.impact }}</p>

          <div class="project-tags-row">
            @for (tag of prj.tags; track tag) {
              <span class="tech-chip">{{ tag }}</span>
            }
          </div>

          <span class="project-action">{{ selectedProjectId() === prj.id ? 'Detalle abierto' : 'Ver detalle' }}</span>
        </div>
      </button>
    }
  </div>

  @if (selectedProject(); as selected) {
    <div class="project-detail-overlay" (click)="clearSelection()">
      <div class="project-detail-shell" (click)="$event.stopPropagation()">
        <app-project-detail [project]="selected" (close)="clearSelection()" />
      </div>
    </div>
  }
</div>
