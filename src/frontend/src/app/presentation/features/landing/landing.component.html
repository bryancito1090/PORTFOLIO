<div class="landing-container">
  <!-- Header Minimalista Flotante (Glassmorphism & Zen High-Contrast) -->
  <header class="zen-header">
    <button
      type="button"
      class="brand-block-btn"
      (click)="scrollToSection('hero')"
      [attr.aria-label]="i18n.t().navHome"
    >
      <img src="assets/images/logo.jpg" alt="Bryan Baño" class="brand-logo" />
    </button>

    <!-- Barra de Navegación Rápida Zen -->
    <nav #navContainer class="zen-nav" aria-label="Navegación principal">
      <button
        type="button"
        class="nav-item"
        data-nav="hero"
        [class.active]="activeSection() === 'hero'"
        (click)="scrollToSection('hero')"
      >
        {{ i18n.t().navHome }}
      </button>

      <button
        type="button"
        class="nav-item"
        data-nav="retro"
        [class.active]="activeSection() === 'retro'"
        (click)="scrollToSection('retro')"
      >
        {{ i18n.t().navRetro }}
      </button>

      <button
        type="button"
        class="nav-item"
        data-nav="projects"
        [class.active]="activeSection() === 'projects'"
        (click)="scrollToSection('projects')"
      >
        {{ i18n.t().navProjects }}
      </button>

      <button
        type="button"
        class="nav-item"
        data-nav="simulator"
        [class.active]="activeSection() === 'simulator'"
        (click)="scrollToSection('simulator')"
      >
        {{ i18n.t().navSimulator }}
      </button>

      <button
        type="button"
        class="nav-item"
        data-nav="terminal"
        [class.active]="activeSection() === 'terminal'"
        (click)="scrollToSection('terminal')"
      >
        {{ i18n.t().navTerminal }}
      </button>

      <button
        type="button"
        class="nav-item"
        data-nav="contact"
        [class.active]="activeSection() === 'contact'"
        (click)="scrollToSection('contact')"
      >
        {{ i18n.t().navContact }}
      </button>
    </nav>

    <div class="header-right-group">
      <app-telemetry-hud></app-telemetry-hud>

      <div class="time-location-block">
        <span class="live-clock">{{ currentTime() }}</span>
        <span class="location-label"> {{ i18n.t().location }}</span>
      </div>

      <button
        type="button"
        class="lang-toggle-btn"
        (click)="i18n.toggleLanguage()"
        [attr.aria-label]="i18n.t().switchLangAria"
      >
        {{ i18n.currentLang() === 'es' ? 'EN' : 'ES' }}
      </button>
    </div>
  </header>

  <!-- SECCIÓN 01: Hero con Laptop 3D desarmable al scroll (240 frames) -->
  <section id="hero" class="landing-section hero-section">
    <app-hero-3d></app-hero-3d>
  </section>

  <!-- CONTENEDOR DE SECCIONES CON LLUVIA MATRIX AMBIENTAL (PANTALLA COMPLETA) -->
  <div class="cyber-matrix-stage-wrapper">
    <!-- Lienzo Matrix Global que abarca toda la pantalla en segundo plano para estas secciones -->
    <app-matrix-rain class="global-matrix-bg"></app-matrix-rain>

    <!-- SECCIÓN 02: Módulos Interactivos (Perfil Técnico & Retro Monitor CRT) -->
    <section id="retro" class="landing-section fullscreen-stage">
      <div class="fullscreen-stage-content">
        <div class="stage-grid">
          <!-- Slot 1: Perfil Técnico & Filosofía de Ingeniería -->
          <article class="module-card profile-module-card">
            <app-technical-profile></app-technical-profile>
          </article>

          <!-- Slot 2: Retro OS en Monitor CRT Antiguo -->
          <article class="module-card retro-module-card">
            <app-retro-os></app-retro-os>
          </article>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 03: Proyectos Destacados (Casos Reales del CV) -->
    <section id="projects" class="landing-section fullscreen-stage">
      <div class="fullscreen-stage-content">
        <app-featured-projects></app-featured-projects>
      </div>
    </section>

    <!-- SECCIÓN 04: Simulador de Incidentes Cloud (Packet Tracer) -->
    <section id="simulator" class="landing-section fullscreen-stage">
      <div class="fullscreen-stage-content">
        <app-incident-simulator></app-incident-simulator>
      </div>
    </section>

    <!-- SECCIÓN 05: Terminal Interactiva Arch Linux / Fish Shell -->
    <section id="terminal" class="landing-section fullscreen-stage">
      <div class="fullscreen-stage-content terminal-content-box">
        <app-terminal></app-terminal>
      </div>
    </section>

    <!-- SECCIÓN 06: Contacto & Muro de Firmas Guestbook -->
    <section id="contact" class="landing-section fullscreen-stage">
      <div class="fullscreen-stage-content">
        <app-contact-section></app-contact-section>
      </div>
    </section>
  </div>

  <!-- Asistente Virtual Flotante Cyber-Zen (n8n + Gemini) -->
  <app-chat-bot></app-chat-bot>
</div>
